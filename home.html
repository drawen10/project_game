<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Prog Evolutions</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="start-screen">
    <h1>Web Prog Evolutions</h1>
    <input type="text" id="player-name" placeholder="Neved">
    <select id="difficulty">
      <option value="easy">Könnyű</option>
      <option value="medium">Közepes</option>
      <option value="hard">Nehéz</option>
    </select>
    <button id="play-btn">PLAY</button>
  </div>

  <div id="game-screen" class="hidden">
    <header>
      <span id="player-display"></span>
      <span id="difficulty-display"></span>
      <span id="timer">00:00</span>
      <span id="score">0</span>
      <button id="draw-btn">DRAW</button>
    </header>
    <aside id="scoreboard"></aside>
    <div id="grid" class="grid"></div>
    <aside id="leaderboard"></aside>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
